services:
  db_test:
    image: postgres:17

    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password_local
      POSTGRES_DB: notifications_test

    ports:
      - "127.0.0.1:5434:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d notifications_test"]
      interval: 5s
      timeout: 5s
      retries: 5
  tests:
    build:
      context: .
      dockerfile: backend/Dockerfile.test

    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password_local
      POSTGRES_DB: notifications_test
      POSTGRES_HOST: db_test
      POSTGRES_PORT: "5432"

      TEST_DATABASE_URL: "postgresql+psycopg://test_user:test_password_local@db_test:5432/notifications_test"

    depends_on:
      db_test:
        condition: service_healthy

    volumes:
    - ./coverage:/reports

    command: >
      python -m pytest -v
      --cov=app
      --cov-report=term-missing
      --cov-report=xml:/reports/coverage.xml