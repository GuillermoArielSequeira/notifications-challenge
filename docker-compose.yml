services:
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
# build: le indica a Docker cómo construir la imagen usando nuestro Dockerfile.
# env_file: proporciona las variables de entorno necesarias para FastAPI.
# environment: reemplaza el host y puerto de PostgreSQL para la ejecución dentro de Docker.
# ports: permite acceder a FastAPI desde tu Mac mediante localhost:8000.
# depends_on: espera a que PostgreSQL esté saludable antes de iniciar FastAPI. 
    build:
      context: .
      dockerfile: backend/Dockerfile

    env_file:
      - .env

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:




